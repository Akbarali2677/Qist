<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قسطوں کا حساب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6B5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#14233B; --muted:#5E6B7A; --line:#DCE3E8;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --in:#1D7A4B; --out:#B3392F; --warn:#B07800; --soft:#E6F0EE;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1620; --surface:#17222E; --ink:#E8EEF3; --muted:#9AA8B5; --line:#2A3846;
    --accent:#3FB59F; --accent-ink:#08201B; --in:#4CC38A; --out:#F07A6E; --warn:#E5B73B; --soft:#1C2F33;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.7}
body{padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 20px}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:20px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px;margin-bottom:12px}
.hero .lbl{font-size:15px;opacity:.9}
.hero .big{font-size:40px;font-weight:700;line-height:1.2;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.hero .sub{display:flex;gap:22px;margin-top:10px;font-size:15px}
.hero .sub b{display:block;font-size:20px;direction:ltr;text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:600}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)} .muted{color:var(--muted);font-size:14px}
.bar{height:9px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
label{display:block;font-size:15px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:17px}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);font-size:16px;padding:10px}
.btn.small{width:auto;padding:6px 14px;margin:0;font-size:15px}
.del{border:0;background:transparent;color:var(--out);font:inherit;font-size:15px;padding:6px 8px}
.link{border:0;background:transparent;color:var(--accent);font:inherit;font-size:16px;padding:6px 4px;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:right;padding:6px 0}
.paid{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.paid:last-child{border-bottom:0}
.paid input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.paid .grow{flex:1}
.paid.done{opacity:.6}
.calc{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:6px 0}
.calc b{font-size:24px;color:var(--accent)}
.deal{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.deal.open{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:18px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center}
nav button .ic{font-size:21px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:700}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:15px;z-index:20;white-space:nowrap}
table.rep{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:15px}
table.rep th,table.rep td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.rep th{background:var(--soft)}
.rep-h{border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:10px}
.rep-deal{margin-bottom:22px;break-inside:avoid}
.btn.a{display:block;text-align:center;text-decoration:none}
table.rep th{text-align:right}
table.tpl{width:100%;border-collapse:collapse;direction:rtl;margin:8px 0;font-size:15px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.tpl td,table.tpl th{border:1.5px solid #000;padding:5px 8px;text-align:right;color:#000}
table.tpl th{background:#FFE699;font-weight:700;width:46%}
table.tpl td{background:#fff;min-height:28px}
table.tpl tr.hd th{background:#BDD7EE}
table.sch th{background:#BDD7EE;text-align:center;width:auto}
table.sch td{text-align:center}
table.sch td.dt{min-width:96px;height:34px}
.band{background:#A9D18E;color:#000;font-weight:700;text-align:center;padding:6px;border:1.5px solid #000;direction:rtl;margin-top:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
textarea{font-size:13px;direction:ltr;text-align:left;font-family:monospace}

.nama{position:relative;z-index:1}
.nt{text-align:center;font-size:26px;margin:6px 0}
.nmeta{display:flex;justify-content:space-between;margin-bottom:6px}
.nama h3{font-size:18px;margin:16px 0 4px}
.nl{padding:2px 0}
.nl2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:2px 0}
.sg{display:flex;justify-content:space-between;gap:10px;margin:14px 0}
.wm{position:fixed;top:38%;left:0;right:0;text-align:center;transform:rotate(-28deg);font-size:46px;font-weight:700;opacity:.07;pointer-events:none;z-index:0;white-space:nowrap}
nav button{font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#999;--soft:#eee;--accent:#0F6B5C;--in:#1D7A4B;--out:#B3392F;--warn:#8a5d00}
  nav,.no-print,.toast{display:none!important}
  body{padding:0}.wrap{max-width:none;padding:0}
  .panel{border:0;padding:0}
  .pb{break-before:page;page-break-before:always}
  table.tpl tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div id="toast" class="toast" style="display:none"></div>

<script>
const MONTHS=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const KEY='qist-hisab-v2', OLD='mera-hisab-v1';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=n=>Math.round(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function newDeal(item,price,advance,pct,months){
  months=months||12;
  return {id:uid(),item:item||'نئی چیز',price:price||0,advance:advance||0,pct:pct==null?40:pct,months,start:'',agreed:0,recv:Array(months).fill(0),rnd:0,info:{}};
}
function defaultState(){return {clients:[]};}
let state=defaultState();
let ui={tab:'home',cid:null,open:null,confirm:null,rep:null};

const S=window.storage
  ?{get:k=>window.storage.get(k),set:(k,v)=>window.storage.set(k,v)}
  :{get:async k=>{const v=localStorage.getItem(k);return v==null?null:{value:v}},set:async(k,v)=>{localStorage.setItem(k,v)}};

async function load(){
  try{
    let r=null;
    try{r=await S.get(KEY)}catch(e){}
    if(r&&r.value){state=JSON.parse(r.value);}
    else if(window.storage){
      let o=null;try{o=await window.storage.get(OLD)}catch(e){}
      if(o&&o.value){
        const old=JSON.parse(o.value);
        if(old.plans&&old.plans.length){
          state={clients:[{id:uid(),name:'مولانا بلال صاحب',deals:old.plans.map(p=>{
            const recv=(p.recv&&p.recv.length)?p.recv.slice():[];
            if(!p.recv){(p.payments||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>recv.push(x.amount));}
            while(recv.length<p.months)recv.push(0);
            return {id:p.id||uid(),item:p.name||'چیز',price:p.price,advance:p.advance,pct:p.pct,months:p.months,start:p.start||'',agreed:p.agreed||0,recv};
          })}]};
        }
      }
    }
  }catch(e){}
  render();
}
async function save(){try{await S.set(KEY,JSON.stringify(state))}catch(e){}}
function toast(msg,label,fn){
  const t=document.getElementById('toast');t.innerHTML='';t.append(msg);t.style.display='block';
  if(label){
    const b=document.createElement('button');b.textContent=label;
    b.style.cssText='margin-inline-start:14px;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;padding:4px 6px';
    b.onclick=()=>{fn();t.style.display='none'};t.append(b);
  }
  clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',label?6000:1700);
}

/* ---------- calculations ---------- */
function calc(p){
  const bal=Math.max(0,p.price-p.advance);
  const profit=Math.ceil(Number((bal*p.pct/100).toFixed(6)));
  const total=bal+profit;
  let m=Math.max(1,p.months),per=Math.round(total/m);
  if(p.rnd>0&&total>0){per=p.rnd;m=Math.max(1,Math.ceil(total/per))}
  if(m===1)per=total;
  const last=total-per*(m-1);
  return {bal,profit,total,m,per,last};
}
function syncMonths(p){
  if(p.rnd>0){p.months=calc(p).m;p.recv=p.recv||[];while(p.recv.length<p.months)p.recv.push(0)}
}
function instAmt(p,i){const c=calc(p);return i===c.m-1?c.last:c.per}
function monthLabel(p,i){
  if(!p.start) return 'ماہ '+(i+1);
  const [y,mo]=p.start.split('-').map(Number);
  const d=new Date(y,mo-1+i,1);
  return MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function stats(p){
  const c=calc(p);const recv=p.recv||[];
  let got=0,count=0;
  for(let i=0;i<c.m;i++){const v=Number(recv[i])||0;got+=v;if(v>0)count++}
  const left=c.total-got;
  const agreed=p.agreed>0?p.agreed:c.per;
  return {...c,got,left,agreed,count,monthsLeft:left>0?Math.ceil(left/agreed):0};
}
function clientStats(c){
  let total=0,got=0,expect=0;
  c.deals.forEach(d=>{const s=stats(d);total+=s.total;got+=s.got;if(s.left>0)expect+=Math.min(s.agreed,s.left)});
  return {total,got,left:total-got,expect};
}
function findDeal(id){for(const c of state.clients){const d=c.deals.find(x=>x.id===id);if(d)return d}return null}
const findClient=id=>state.clients.find(c=>c.id===id);


const shiftM=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+y};
function monthIndex(p,ym){
  if(!p.start) return null;
  const [sy,sm]=p.start.split('-').map(Number);const [y,m]=ym.split('-').map(Number);
  return (y-sy)*12+(m-sm);
}
const baseAmt=(p,i)=>p.agreed>0?p.agreed:instAmt(p,i);
function dueInfo(p,ym){
  const c=calc(p),s=stats(p),recv=p.recv||[];
  const idx=monthIndex(p,ym);
  if(idx===null) return s.left>0?{idx:null,due:s.agreed,got:0,arrears:0,left:s.left}:null;
  if(idx<0) return null;
  if(idx>=c.m) return s.left>0?{idx,due:0,got:0,arrears:s.left,left:s.left,over:true}:null;
  let arrears=0;
  for(let j=0;j<idx;j++) arrears+=Math.max(0,baseAmt(p,j)-(Number(recv[j])||0));
  arrears=Math.min(arrears,Math.max(0,s.left));
  return {idx,due:baseAmt(p,idx),got:Number(recv[idx])||0,arrears,left:Math.max(0,s.left)};
}
const pendOf=x=>Math.min(x.info.left,Math.max(0,x.info.due-x.info.got)+x.info.arrears);
function collectRows(ym){
  const out=[];
  state.clients.forEach(c=>{
    const items=[];c.deals.forEach(d=>{const info=dueInfo(d,ym);if(info)items.push({d,info})});
    if(items.length)out.push({c,items});
  });
  return out;
}
function waLink(phone,text){
  let n=String(phone||'').replace(/\D/g,'');if(!n)return '';
  if(n.startsWith('0'))n='92'+n.slice(1);
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(text);
}
function remindText(c,items,ym){
  let t=`السلام علیکم ${c.name}،\n${ymLabel(ym)} کی قسط کی یاددہانی:\n`;let tot=0;
  items.forEach(x=>{
    const pend=pendOf(x);if(pend<=0)return;tot+=pend;
    t+=`• ${x.d.item}: ${fmt(pend)} روپے`+(x.info.arrears>0?` (اس میں پچھلا بقایا ${fmt(x.info.arrears)} شامل ہے)`:'')+`، کل باقی ${fmt(x.info.left)}\n`;
  });
  return t+`کل واجب الادا: ${fmt(tot)} روپے۔\nبراہِ کرم ادا فرما دیں۔ جزاک اللہ خیراً`;
}
function stmtText(c,deals){
  let t=`السلام علیکم ${c.name}،\nآپ کے قسطوں کا حساب (${today()}):\n`;let left=0;
  deals.forEach(d=>{const s=stats(d);left+=Math.max(0,s.left);
    t+=`• ${d.item}: کل ${fmt(s.total)}، وصول ${fmt(s.got)}، باقی ${s.left>0?fmt(s.left):'مکمل ادا'}\n`});
  return t+`کل باقی: ${fmt(left)} روپے\nجزاک اللہ خیراً`;
}
function copyText(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);
  ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  if(ok){ui.fb=null;toast('کاپی ہو گیا، اب واٹس ایپ میں چسپاں کریں')}
  else{ui.fb=text;render();const f=document.getElementById('fbt');if(f){f.focus();f.select();f.setSelectionRange(0,f.value.length)}toast('متن منتخب ہے، خود کاپی کریں')}
}

/* ---------- views ---------- */
function viewHome(){
  let total=0,got=0,expect=0,profit=0;
  state.clients.forEach(c=>{const s=clientStats(c);total+=s.total;got+=s.got;expect+=s.expect;c.deals.forEach(d=>profit+=calc(d).profit)});
  const left=total-got;
  let h=`<div class="top"><h1>قسطوں کا حساب</h1></div>
  <div class="hero"><div class="lbl">کل باقی وصولی</div><div class="big">${fmt(left)}</div>
    <div class="sub"><div>کل طے شدہ<b>${fmt(total)}</b></div><div>اب تک وصول<b>${fmt(got)}</b></div></div></div>
  <div class="panel">
    <div class="row"><span>ہر ماہ متوقع وصولی</span><span class="num">${fmt(expect)}</span></div>
    <div class="row"><span>کل منافع (طے شدہ)</span><span class="num in">${fmt(profit)}</span></div>
    <div class="row"><span>گاہک / سودے</span><span class="num">${state.clients.length} / ${state.clients.reduce((a,c)=>a+c.deals.length,0)}</span></div>
  </div><h2>گاہک</h2><div class="panel">`;
  if(!state.clients.length) h+=`<div class="empty">ابھی کوئی گاہک نہیں۔<br>نیچے "گاہک" میں نیا گاہک شامل کریں۔</div>`;
  state.clients.forEach(c=>{
    const s=clientStats(c);
    h+=`<button class="item" data-a="opencl" data-v="${c.id}"><span><b>${esc(c.name)}</b><div class="muted">${c.deals.length} سودے</div></span>
      <span style="text-align:left"><span class="num ${s.left>0?'warn':'in'}">${s.left>0?fmt(s.left):'مکمل ✓'}</span><div class="muted">باقی</div></span></button>
      <div class="bar"><i style="width:${s.total?Math.min(100,Math.round(s.got/s.total*100)):0}%"></i></div><div style="height:8px"></div>`;
  });
  return h+`</div>`;
}

function viewCollect(){
  const ym=ui.cm||today().slice(0,7);
  const rows=collectRows(ym);
  let due=0,got=0,arr=0,pend=0;
  rows.forEach(r=>r.items.forEach(x=>{due+=x.info.due;got+=x.info.got;arr+=x.info.arrears;pend+=pendOf(x)}));
  let h=`<div class="top"><h1>اس مہینے کی وصولی</h1>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="link" data-a="cprev" aria-label="پچھلا مہینہ">›</button>
      <b>${ymLabel(ym)}</b>
      <button class="link" data-a="cnext" aria-label="اگلا مہینہ">‹</button></div></div>
  <div class="hero"><div class="lbl">ابھی وصول ہونا باقی</div><div class="big">${fmt(pend)}</div>
    <div class="sub"><div>اس مہینے کی قسطیں<b>${fmt(due)}</b></div><div>ملا<b>${fmt(got)}</b></div><div>پچھلا بقایا<b>${fmt(arr)}</b></div></div></div>`;
  if(!rows.length) h+=`<div class="panel"><div class="empty">اس مہینے کی کوئی قسط نہیں۔<br>سودے میں "پہلی قسط کا مہینہ" چنا ہو تو یہاں نظر آئے گی۔</div></div>`;
  rows.forEach(({c,items})=>{
    const cp=items.reduce((a,x)=>a+pendOf(x),0);
    const text=remindText(c,items,ym);
    const wa=waLink(c.phone,text);
    h+=`<div class="panel"><div class="row" style="border:0;padding-top:0"><b>${esc(c.name)}</b><span class="num ${cp>0?'warn':'in'}">${cp>0?fmt(cp):'ادا ✓'}</span></div>`;
    items.forEach(x=>{
      const {info:i,d}=x;const done=i.idx!==null&&i.got>0&&i.got>=i.due;
      h+=`<div class="paid ${done?'done':''}">
        <input type="checkbox" data-ct="${d.id}" ${done?'checked':''} ${i.idx===null||i.over?'disabled':''} aria-label="وصول">
        <div class="grow"><div>${esc(d.item)}</div>
        <div class="muted">${i.idx===null?'پہلی قسط کا مہینہ طے نہیں · ':''}${i.over?'مدت پوری، باقی رقم · ':'قسط '}<span class="num">${fmt(i.due)}</span>${i.got?` · ملا <span class="num in">${fmt(i.got)}</span>`:''}${i.arrears>0&&!i.over?` · پچھلا بقایا <span class="num out">${fmt(i.arrears)}</span>`:''} · کل باقی <span class="num">${fmt(i.left)}</span></div></div></div>`;
    });
    if(cp>0){
      h+=`<button class="btn ghost" data-a="remind" data-v="${c.id}">یاددہانی کا پیغام کاپی کریں</button>`;

const INV_TERMS_DEFAULT=`سرمایہ کار نے مذکورہ رقم کاروبار میں لگانے کے لیے کاروبار کرنے والے کے سپرد کی ہے۔
حاصل شدہ حقیقی نفع میں سے سرمایہ کار کا حصہ {pct}% اور باقی کاروبار کرنے والے کا ہوگا۔
نفع کا حساب اور تقسیم ہر {every} ماہ بعد ہوگی۔
نفع نہ ہونے کی صورت میں کسی نفع کی ادائیگی لازم نہیں ہوگی۔
نقصان کی صورت میں، کاروبار کرنے والے کی کوتاہی کے بغیر، نقصان سرمائے کی حد تک سرمایہ کار برداشت کرے گا۔
اصل رقم کی واپسی باہمی رضامندی سے طے شدہ طریقے پر ہوگی۔`;
const INVS=()=>(state.investors=state.investors||[]);
const findInv=id=>INVS().find(x=>x.id===id);
function dealProfitMonth(d,ym){
  const idx=monthIndex(d,ym);if(idx===null||idx<0)return 0;
  const c=calc(d);if(idx>=c.m||!(c.total>0))return 0;
  return (Number((d.recv||[])[idx])||0)*c.profit/c.total;
}
function invPeriods(inv){
  const out=[];const every=Math.max(1,Number(inv.every)||1);
  const startYM=(inv.date||today()).slice(0,7),nowYM=today().slice(0,7);
  const deals=[];state.clients.forEach(c=>c.deals.forEach(d=>{if(d.inv===inv.id)deals.push(d)}));
  let k=startYM,guard=0;
  while(k<=nowYM&&guard++<240){
    const months=[];for(let i=0;i<every;i++)months.push(shiftM(k,i));
    let auto=0;deals.forEach(d=>months.forEach(m=>{auto+=dealProfitMonth(d,m)}));auto=Math.round(auto);
    const mv=(inv.manual||{})[k];const manual=(mv!==undefined&&mv!==null&&mv!=='')?Number(mv):null;
    const profit=manual!==null?manual:auto;
    const endYM=months[months.length-1];
    out.push({key:k,label:every===1?ymLabel(k):ymLabel(k)+' سے '+ymLabel(endYM),auto,manual,profit,share:Math.round(profit*(Number(inv.pct)||0)/100),done:endYM<nowYM});
    k=shiftM(k,every);
  }
  return out;
}
function invSum(inv){
  const per=invPeriods(inv);
  const shares=per.reduce((a,p)=>a+p.share,0);
  const paid=(inv.payouts||[]).reduce((a,p)=>a+p.amount,0);
  const ret=(inv.returns||[]).reduce((a,p)=>a+p.amount,0);
  const deals=[];state.clients.forEach(c=>c.deals.forEach(d=>{if(d.inv===inv.id)deals.push({c,d})}));
  return {per,shares,paid,due:shares-paid,ret,capLeft:(Number(inv.amount)||0)-ret,deals};
}
function invText(inv){
  const s=invSum(inv);
  let t=`السلام علیکم ${inv.name}،\nآپ کی سرمایہ کاری کا حساب (${today()}):\n• لگائی ہوئی رقم: ${fmt(inv.amount)}\n• آپ کا حصہ: ${inv.pct}% نفع\n• اب تک کا حصہ: ${fmt(s.shares)}\n• اب تک ادا: ${fmt(s.paid)}\n• باقی حصہ: ${fmt(Math.max(0,s.due))}\n`;
  if(s.ret>0)t+=`• واپس کی گئی اصل رقم: ${fmt(s.ret)}\n`;
  return t+'جزاک اللہ خیراً';
}

  <div class="nl2"><span><b>موبائل نمبر:</b> <span class="num">${esc(inv.phone||'')}</span></span></div>
  <div class="nl2"><span><b>کاروبار کرنے والا:</b> ${esc(g.sellerName)}</span><span><b>شناختی کارڈ نمبر:</b> <span class="num">${esc(g.sellerCnic)}</span></span></div>
  <h3>(2) سرمایہ کی تفصیل</h3>
  <table class="tpl"><tbody>${trow('سرمایہ کی رقم',fmt(inv.amount)+' روپے')}${trow('تاریخ',inv.date?isoU(inv.date):'')}${trow('سرمایہ کار کا حصہ',inv.pct+'% حقیقی نفع')}${trow('نفع کی تقسیم',ev===1?'ہر ماہ':'ہر '+ev+' ماہ بعد')}</tbody></table>
  <h3>(3) شرائط و ضوابط</h3>${terms.map((t,i)=>`<div class="nl">(${i+1}) ${esc(t)}</div>`).join('')}
  <div style="margin-top:18px">${sig('سرمایہ کار:',inv.name)}${sig('کاروبار کرنے والا:',g.sellerName)}${sig('گواہ نمبر 1:',g.w1)}${sig('گواہ نمبر 2:',g.w2)}</div></div>`;
}
function viewReport(){
  if(ui.rep.kind==='nama')return viewNama();
  if(ui.rep.kind==='inv')return viewInvStatement();
  if(ui.rep.kind==='invag')return viewInvAgreement();
  const c=findClient(ui.rep.cid);
  if(!c){ui.rep=null;return viewHome()}
  const deals=c.deals.filter(d=>(ui.rep.dids||[]).includes(d.id));
  if(!deals.length){ui.rep=null;return viewClient()}
  let h=`<div class="top no-print"><button class="link" data-a="repback">‹ واپس</button><button class="btn small" data-a="print">پرنٹ / PDF</button></div>
  <div class="muted no-print" style="margin-bottom:8px">پرنٹ کھلنے پر "PDF محفوظ کریں" (Save as PDF) چنیں، پھر واٹس ایپ وغیرہ پر بھیج دیں۔</div>
  <button class="btn ghost no-print" data-a="stmt" data-v="${c.id}" style="margin:0 0 12px">حساب کا پیغام کاپی کریں</button>`;
  h+=repFirst(c,deals);
  deals.forEach((d,i)=>{h+=`<div class="pb" style="break-before:page;page-break-before:always">${repAcct(d,i,deals.length>1)}</div>`});
  return h;
}

function viewBackup(){
  return `<div class="top"><h1>ڈیٹا کی نقل</h1></div>
  <div class="panel"><b>نقل بنائیں</b>
    <div class="muted" style="margin:4px 0 8px">نیچے سارا حساب لکھا ہے۔ "کاپی کریں" دبا کر واٹس ایپ پر اپنے آپ کو (یا نوٹس میں) بھیج کر رکھ لیں۔</div>
    <textarea id="bk" readonly rows="6">${esc(JSON.stringify(state))}</textarea>
    <button class="btn" data-a="copybk">کاپی کریں</button></div>
  <div class="panel"><b>نقل واپس لائیں</b>
    <div class="muted" style="margin:4px 0 8px">محفوظ کی ہوئی نقل یہاں چسپاں کریں۔ اس سے موجودہ حساب کی جگہ وہ حساب آ جائے گا۔</div>
    <textarea id="rs" rows="6" placeholder="یہاں چسپاں کریں"></textarea>
    <button class="btn ghost" data-a="restore">${ui.confirm==='restore'?'دوبارہ دبائیں، موجودہ حساب بدل جائے گا':'واپس لائیں'}</button></div>`;
}

function render(){
  const app=document.getElementById('app');
  const y=window.scrollY;
  let v;
  if(ui.rep) v=viewReport();
  else if(ui.tab==='client') v=viewClient();
  else if(ui.tab==='clients') v=viewClients();
  else if(ui.tab==='collect') v=viewCollect();
  else if(ui.tab==='set') v=viewSet();
  else if(ui.tab==='inv') v=ui.invId?viewInvestor():viewInvestors();
  else if(ui.tab==='backup') v=viewBackup();
  else v=viewHome();
  app.innerHTML=(ui.fb?`<div class="panel no-print"><b>یہ متن کاپی کریں</b><textarea id="fbt" rows="8" class="mono">${esc(ui.fb)}</textarea><button class="btn ghost" data-a="fbclose">بند کریں</button></div>`:'')+v;
  const tabs=[['home','◔','خلاصہ'],['collect','₨','وصولی'],['clients','☰','گاہک'],['inv','◈','سرمایہ کار'],['set','⚙','ترتیب'],['backup','⤓','نقل']];
  const act=ui.tab==='client'?'clients':ui.tab;
  document.getElementById('nav').innerHTML=tabs.map(([k,i,l])=>`<button data-tab="${k}" class="${act===k&&!ui.rep?'on':''}"><span class="ic">${i}</span>${l}</button>`).join('');
  window.scrollTo(0,y);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){ui.tab=tb.dataset.tab;if(ui.tab==='inv')ui.invId=null;ui.rep=null;ui.confirm=null;render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-a]');
  if(!el) return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a==='opencl'){ui.cid=v;ui.tab='client';ui.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='addinv'){
    const n=document.getElementById('nin').value.trim();if(!n){toast('نام لکھیں');return}
    const inv={id:uid(),name:n,cnic:'',phone:'',amount:0,date:today(),pct:40,every:1,payouts:[],returns:[],manual:{}};
    INVS().push(inv);ui.invId=inv.id;save();render();window.scrollTo(0,0)
  }
  else if(a==='openinv'){ui.invId=v;ui.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='invback'){ui.invId=null;ui.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='invadd'){
    const k=el.dataset.k;const inv=findInv(v);
    const amt=Number(document.getElementById(k+'a').value);const dt=document.getElementById(k+'d').value||today();const note=document.getElementById(k+'n').value.trim();
    if(!(amt>0)){toast('رقم لکھیں');return}
    inv[k]=inv[k]||[];inv[k].push({id:uid(),amount:amt,date:dt,note});save();render();toast('درج ہو گیا');
  }
  else if(a==='invdel'){
    const inv=findInv(el.dataset.id);const k=el.dataset.k;const i=inv[k].findIndex(x=>x.id===v);const x=inv[k].splice(i,1)[0];save();render();
    toast('ہٹا دیا','واپس',()=>{inv[k].push(x);save();render()});
  }
  else if(a==='invdelete'){
    if(ui.confirm===v){
      const i=INVS().findIndex(x=>x.id===v);const x=INVS().splice(i,1)[0];
      state.clients.forEach(c=>c.deals.forEach(d=>{if(d.inv===v)d.inv=''}));
      ui.confirm=null;ui.invId=null;save();render();
      toast('سرمایہ کار حذف ہو گیا','واپس',()=>{INVS().splice(i,0,x);save();render()});
    }else{ui.confirm=v;render()}
  }
  else if(a==='invrep'){ui.rep={iid:v,kind:'inv'};render();window.scrollTo(0,0)}
  else if(a==='invag'){ui.rep={iid:v,kind:'invag'};render();window.scrollTo(0,0)}
  else if(a==='invmsg'){copyText(invText(findInv(v)))}
  else if(a==='setrnd'){const p=findDeal(el.dataset.id);p.rnd=Number(v)||0;syncMonths(p);save();render()}
  else if(a==='nama'){
    const p=findDeal(v);const c=state.clients.find(x=>x.deals.some(d=>d.id===v));
    if(!p.billNo){const g=CFG();p.billNo=pad3(g.nextBill||1);state.cfg=Object.assign({},state.cfg||{},{nextBill:(Number(g.nextBill)||1)+1});save()}
    ui.rep={cid:c.id,dids:[v],kind:'nama'};render();window.scrollTo(0,0)
  }
  else if(a==='back'){ui.tab='clients';ui.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='toggle'){ui.open=ui.open===v?null:v;ui.confirm=null;render()}
  else if(a==='addclient'){
    const n=document.getElementById('ncn').value.trim();
    if(!n){toast('پہلے نام لکھیں');return}
    const c={id:uid(),name:n,deals:[]};state.clients.push(c);ui.cid=c.id;ui.tab='client';save();render();window.scrollTo(0,0);
  }
  else if(a==='adddeal'){
    const c=findClient(v);const n=document.getElementById('ndi').value.trim();
    if(!n){toast('چیز کا نام لکھیں');return}
    const d=newDeal(n);c.deals.push(d);ui.open=d.id;save();render();toast('سودا شامل ہو گیا');
  }
  else if(a==='deldeal'){
    if(ui.confirm===v){
      const c=state.clients.find(c=>c.deals.some(d=>d.id===v));
      const i=c.deals.findIndex(d=>d.id===v);const x=c.deals.splice(i,1)[0];ui.confirm=null;ui.open=null;save();render();
      toast('سودا حذف ہو گیا','واپس',()=>{c.deals.splice(i,0,x);save();render()});
    }else{ui.confirm=v;render()}
  }
  else if(a==='delclient'){
    if(ui.confirm===v){
      const i=state.clients.findIndex(c=>c.id===v);const x=state.clients.splice(i,1)[0];ui.confirm=null;ui.tab='clients';save();render();
      toast('گاہک حذف ہو گیا','واپس',()=>{state.clients.splice(i,0,x);save();render()});
    }else{ui.confirm=v;render()}
  }
  else if(a==='report'){const c=state.clients.find(c=>c.deals.some(d=>d.id===v));ui.rep={cid:c.id,dids:[v]};render();window.scrollTo(0,0)}
  else if(a==='mkrep'){const c=findClient(v);const dids=repSelOf(c);if(!dids.length){toast('کم از کم ایک سودا چنیں');return}ui.rep={cid:v,dids};render();window.scrollTo(0,0)}
  else if(a==='cprev'){ui.cm=shiftM(ui.cm||today().slice(0,7),-1);render()}
  else if(a==='cnext'){ui.cm=shiftM(ui.cm||today().slice(0,7),1);render()}
  else if(a==='remind'){const ym=ui.cm||today().slice(0,7);const r=collectRows(ym).find(x=>x.c.id===v);if(r)copyText(remindText(r.c,r.items,ym))}
  else if(a==='stmt'){const c=findClient(v);copyText(stmtText(c,c.deals.filter(d=>(ui.rep.dids||[]).includes(d.id))))}
  else if(a==='fbclose'){ui.fb=null;render()}
  else if(a==='repback'){ui.rep=null;render()}
  else if(a==='copybk'){
    const ta=document.getElementById('bk');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
    let ok=false;
    try{ok=document.execCommand('copy')}catch(err){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>toast('کاپی ہو گیا'),()=>toast('متن منتخب ہے، خود کاپی کریں'));return}
    toast(ok?'کاپی ہو گیا':'متن منتخب ہے، خود کاپی کریں');
  }
  else if(a==='restore'){
    const txt=document.getElementById('rs').value.trim();
    if(!txt){toast('پہلے نقل چسپاں کریں');return}
    let obj=null;try{obj=JSON.parse(txt)}catch(err){}
    if(!obj||!Array.isArray(obj.clients)){toast('یہ درست نقل نہیں لگتی');return}
    if(ui.confirm!=='restore'){ui.confirm='restore';render();document.getElementById('rs').value=txt;return}
    state=obj;ui.confirm=null;ui.tab='home';save();render();toast('حساب واپس آ گیا');
  }
  else if(a==='print'){
    try{window.print()}catch(err){toast('پرنٹ نہیں کھل سکا')}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cf){const c=findClient(t.dataset.id);if(t.dataset.cf==='name')c.name=t.value.trim()||c.name;else c[t.dataset.cf]=t.value.trim();save();render();return}
  if(t.dataset.info){const p=findDeal(t.dataset.id);p.info=p.info||{};p.info[t.dataset.info]=t.value.trim();save();return}
  if(t.dataset.rs){
    const c=state.clients.find(x=>x.deals.some(d=>d.id===t.dataset.rs));ui.repSel=ui.repSel||{};
    const cur=repSelOf(c);const i=cur.indexOf(t.dataset.rs);if(i>=0)cur.splice(i,1);else cur.push(t.dataset.rs);ui.repSel[c.id]=cur;render();return;
  }
  if(t.dataset.ct){
    const p=findDeal(t.dataset.ct);const ym=ui.cm||today().slice(0,7);const idx=monthIndex(p,ym);
    if(idx===null||idx<0||idx>=calc(p).m)return;
    p.recv=p.recv||[];
    if(t.checked){const st=stats(p);p.recv[idx]=Math.min(baseAmt(p,idx),Math.max(st.left,0))}
    else p.recv[idx]=0;
    save();render();return;
  }
  if(t.dataset.s){
    const p=findDeal(t.dataset.id);
    const m=document.getElementById('sm-'+p.id).value,y=document.getElementById('sy-'+p.id).value;
    p.start=m?(y+'-'+m):'';save();render();return;
  }
  if(t.dataset.r){
    const p=findDeal(t.dataset.id);p.recv=p.recv||[];
    p.recv[Number(t.dataset.i)]=Math.max(0,Number(t.value)||0);save();render();return;
  }
  if(t.dataset.a==='tick'){
    const p=findDeal(t.dataset.id);const i=Number(t.dataset.i);p.recv=p.recv||[];
    if(t.checked){
      if(!(p.recv[i]>0)){
        const st=stats(p);
        let amt=p.agreed>0?p.agreed:instAmt(p,i);
        if(st.left>0) amt=Math.min(amt,st.left);
        p.recv[i]=amt;
      }
    } else p.recv[i]=0;
    save();render();return;
  }
  if(t.dataset.iv){
    const inv=findInv(t.dataset.id);const k=t.dataset.iv;
    inv[k]=['amount','pct','every'].includes(k)?Math.max(0,Number(t.value)||0):t.value.trim();
    if(k==='every'&&!inv.every)inv.every=1;
    save();render();return;
  }
  if(t.dataset.ivm){
    const inv=findInv(t.dataset.id);inv.manual=inv.manual||{};
    if(t.value==='')delete inv.manual[t.dataset.ivm];else inv.manual[t.dataset.ivm]=Number(t.value)||0;
    save();render();return;
  }
  if(t.dataset.fsel){const p=findDeal(t.dataset.id);p[t.dataset.fsel]=t.value;save();render();return}
  if(t.dataset.fb){const p=findDeal(t.dataset.id);p[t.dataset.fb]=t.checked;save();render();return}
  if(t.dataset.cfg){
    const k=t.dataset.cfg;state.cfg=Object.assign({},state.cfg||{});
    state.cfg[k]=t.type==='checkbox'?t.checked:(['firstDay','dueDay','nextBill'].includes(k)?Math.max(1,Math.round(Number(t.value))||1):t.value.trim());
    save();toast('محفوظ');return;
  }
  if(t.dataset.f){
    const p=findDeal(t.dataset.id);const f=t.dataset.f;
    if(f==='item') p.item=t.value.trim()||p.item;
    else if(['billNo','namaDate','w1','w2','agName','agCnic','agPhone'].includes(f)) p[f]=t.value.trim();
    else{
      p[f]=Math.max(0,Number(t.value)||0);
      if(f==='price'||f==='advance'||f==='pct'||f==='rnd') syncMonths(p);
      if(f==='months'){p.months=Math.max(1,Math.min(60,Math.round(p.months)||1));p.recv=p.recv||[];while(p.recv.length<p.months)p.recv.push(0)}
    }
    save();render();return;
  }
});
load();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
